plugins {
    id "com.android.application"
}

android {
    namespace "br.cadu.fisico"
    compileSdk 34

    defaultConfig {
        applicationId "br.cadu.fisico.voz"  // id novo: instala ao lado do app antigo (assinatura diferente), sem desinstalar
        minSdk 21          // J3 2016 roda Android 5.1 (API 22)
        targetSdk 34
        versionCode 18
        versionName "0.9.7-rede"
    }

    // Chave FIXA: toda versão sai com a mesma assinatura, então o J3 aceita
    // atualizar por cima. A chave vem dos segredos do GitHub (nunca fica no código).
    def chave = file("cadu.keystore")
    signingConfigs {
        fixa {
            storeFile chave
            storePassword System.getenv("CADU_KEY_PASS") ?: ""
            keyAlias "cadu"
            keyPassword System.getenv("CADU_KEY_PASS") ?: ""
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (chave.exists()) signingConfig signingConfigs.fixa
        }
    }

    // jogos, fontes e 3D vão dentro do app: dá para jogar sem o PC (tela offline)
    sourceSets { main { assets.srcDirs += ["../../web/static"] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
