<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cadu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  .rosto { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex;
           -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .olho { width: 22vmin; height: 3vmin; margin: 0 9vmin; background: #3a6f7d; border-radius: 3vmin;
          -webkit-animation: respira 4s ease-in-out infinite; animation: respira 4s ease-in-out infinite; }
  @-webkit-keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  @keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .rosto { bottom: 40vmin; }
  .msg { position: absolute; top: 15vmin; left: 0; right: 0; z-index: 5; text-align: center; color: #3a6f7d;
         font-size: 4.2vmin; line-height: 1.5; letter-spacing: .05em; padding: 0 4vmin; }
  .dica { font-size: 3.2vmin; opacity: .8; }
  .barra { position: absolute; top: 3vmin; right: 3vmin; z-index: 10; }
  .bt { display: inline-block; margin-left: 2vmin; height: 9vmin; line-height: 9vmin; padding: 0 4vmin; border-radius: 4.5vmin;
        background: #111c21; border: .3vmin solid #1d2e35; color: #cfe3e8; font-size: 3.6vmin; }
  .bt:active { background: #1d3540; }
  #par { display: none; z-index: 20; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.92); text-align: center; padding-top: 8vmin; color: #cfe3e8; }
  #par.ver { display: block; }
  #par h2 { color: #ffd166; font-size: 5vmin; margin: 0 0 3vmin; }
  #parMsg { font-size: 3.8vmin; min-height: 10vmin; padding: 0 6vmin; }
  #cod { width: 46vmin; font-size: 8vmin; letter-spacing: 2vmin; text-align: center; background: #111c21; color: #fff; border: .4vmin solid #3a6f7d; border-radius: 2vmin; padding: 1vmin; }
  #mic { position: absolute; z-index: 10; left: 50%; bottom: 13vmin; -webkit-transform: translateX(-50%); transform: translateX(-50%); height: 15vmin; line-height: 15vmin;
         padding: 0 7vmin; border-radius: 7.5vmin; background: #12362c; border: .5vmin solid #06d6a0; color: #e8fff6; font-size: 5vmin; white-space: nowrap; }
  #mic.rec { background: #3d1621; border-color: #ef476f; -webkit-animation: respira 1s ease-in-out infinite; animation: respira 1s ease-in-out infinite; }
  #micInfo { position: absolute; z-index: 10; left: 0; right: 0; bottom: 5vmin; text-align: center; color: #6fb3a0; font-size: 3.4vmin; }
  .bt.ok { background: #06d6a0; color: #0d1020; border-color: #06d6a0; }
</style>
</head>
<body>
  <div class="barra">
    <span class="bt" id="parear" style="display:none">🔑 Parear</span>
    <span class="bt" id="wifi">📶 Wi-Fi</span>
    <span class="bt" id="ajustes">⚙️ Ajustes</span>
  </div>
  <div id="par">
    <h2>Parear com o PC sem cabo</h2>
    <div id="parMsg">Procurando o PC na rede…</div>
    <input id="cod" type="tel" maxlength="6" placeholder="000000"><br><br>
    <span class="bt ok" id="confirmar">Confirmar</span> <span class="bt" id="outro">Pedir outro código</span> <span class="bt" id="fechar">Fechar</span>
  </div>
  <div class="rosto"><div class="olho"></div><div class="olho"></div></div>
  <div id="mic">🎤 Gravar post-it</div>
  <div id="micInfo"></div>
  <div class="msg">zzz… procurando o PC<br><span class="dica" id="dica"></span></div>
<script>
  // A busca (cabo e Wi-Fi) é feita pelo app; aqui só a mensagem e os atalhos.
  function info() {
    try {
      var r = JSON.parse(Cadu.infoRede()), d;
      document.getElementById("parear").style.display = r.pareado ? "none" : "inline-block";
      if (!r.pareado) d = "toque em 🔑 Parear para ligar ao PC pelo Wi-Fi";
      else if (!r.wifiLigado) d = "Wi-Fi do celular desligado — toque em 📶 Wi-Fi";
      else if (!r.rede) d = "Wi-Fi sem rede — toque em 📶 Wi-Fi e escolha a de casa";
      else d = "na rede " + r.rede + " · aguardando o PC (agente ligado?)";
      document.getElementById("dica").textContent = d;
    } catch (e) {}
    setTimeout(info, 3000);
  }
  document.getElementById("wifi").onclick = function () { try { Cadu.abrirWifi(); } catch (e) {} };
  document.getElementById("ajustes").onclick = function () { try { Cadu.abrirAjustes(); } catch (e) {} };
  var par = document.getElementById("par"), pm = document.getElementById("parMsg"), cod = document.getElementById("cod");
  function pedir() { pm.textContent = "Procurando o PC na rede…"; try { Cadu.pedirCodigo(); } catch (e) { pm.textContent = "Este app não tem pareamento sem cabo."; } }
  window.aoParear = function (tipo, msg) {
    pm.textContent = msg;
    if (tipo === "pedido") cod.focus();
    if (tipo === "ok") setTimeout(function () { par.className = ""; }, 1500);
  };
  document.getElementById("parear").onclick = function () { par.className = "ver"; cod.value = ""; pedir(); };
  document.getElementById("outro").onclick = pedir;
  document.getElementById("fechar").onclick = function () { par.className = ""; };
  document.getElementById("confirmar").onclick = function () { pm.textContent = "Conferindo…"; try { Cadu.enviarCodigo(cod.value); } catch (e) {} };
  // post-it de voz sem PC: grava aqui e manda quando o PC voltar
  var mic = document.getElementById("mic"), mi = document.getElementById("micInfo");
  function pend(n) { mi.textContent = n ? n + (n > 1 ? " post-its esperando" : " post-it esperando") + " o PC — vão sozinhos quando ele voltar" : "fale depois de tocar · para sozinho quando você parar de falar"; }
  try { pend(Cadu.pendentes()); } catch (e) { mic.style.display = "none"; }
  mic.onclick = function () { try { Cadu.vibrar(30); Cadu.gravarIniciar(); } catch (e) {} };
  window.aoGravador = function (estado, seg, n) {
    if (estado === "gravando") { mic.className = "rec"; mic.textContent = "⏹ Gravando… " + seg + "s"; mi.textContent = "toque para terminar"; return; }
    mic.className = ""; mic.textContent = "🎤 Gravar post-it";
    if (estado === "salvo") { pend(n); try { Cadu.vibrarPadrao(); } catch (e) {} }
    else if (estado === "vazio") mi.textContent = "não ouvi nada — toque e fale mais perto";
    else if (estado === "erro") mi.textContent = "microfone ocupado — tente de novo";
  };
  info();
</script>
</body>
</html>
