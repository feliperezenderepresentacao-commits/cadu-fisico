<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cadu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .rosto { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex;
           -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .olho { width: 22vmin; height: 3vmin; margin: 0 9vmin; background: #3a6f7d; border-radius: 3vmin;
          -webkit-animation: respira 4s ease-in-out infinite; animation: respira 4s ease-in-out infinite; }
  @-webkit-keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  @keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .msg { position: absolute; bottom: 10vmin; width: 100%; text-align: center; color: #3a6f7d;
         font: 4.2vmin/1.5 sans-serif; letter-spacing: .05em; }
  .dica { font-size: 3.2vmin; opacity: .7; }
</style>
</head>
<body>
  <div class="rosto"><div class="olho"></div><div class="olho"></div></div>
  <div class="msg">zzz… procurando o PC<br><span class="dica" id="dica"></span></div>
<script>
  // A busca (cabo e Wi-Fi) é feita pelo app; aqui só a mensagem.
  try {
    document.getElementById("dica").textContent = (window.Cadu && Cadu.pareado())
      ? "pelo cabo ou pelo Wi-Fi de casa"
      : "conecte o cabo uma vez para liberar o Wi-Fi";
  } catch (e) {}
</script>
</body>
</html>
