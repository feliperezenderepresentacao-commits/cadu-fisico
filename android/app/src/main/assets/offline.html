<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cadu</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .rosto { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex;
           -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .olho { width: 22vw; height: 3vw; margin: 0 9vw; background: #3a6f7d; border-radius: 3vw;
          -webkit-animation: respira 4s ease-in-out infinite; animation: respira 4s ease-in-out infinite; }
  @-webkit-keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .msg { position: absolute; bottom: 12vh; width: 100%; text-align: center; color: #3a6f7d;
         font: 4.2vw/1.4 sans-serif; letter-spacing: .05em; }
  @keyframes respira { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
</style>
</head>
<body>
  <div class="rosto"><div class="olho"></div><div class="olho"></div></div>
  <div class="msg">zzz… procurando o PC</div>
<script>
  // Tenta reconectar ao agente do PC a cada 4 s.
  setTimeout(function () {
    if (window.Cadu && Cadu.recarregar) { Cadu.recarregar(); }
    else { location.replace("http://127.0.0.1:8765/"); }
  }, 4000);
</script>
</body>
</html>
