name: Gerar APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle -p android assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cadu-fisico.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cadu-fisico-apk
          path: cadu-fisico.apk

      - name: Publicar na release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima cadu-fisico.apk --title "Cadu físico — última versão" --notes "APK gerado do commit ${GITHUB_SHA::7}."
